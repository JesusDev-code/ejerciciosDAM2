<ion-header class="ion-no-border">
  <ion-toolbar style="--background: #0f1e23;">
    <ion-searchbar 
      placeholder="Buscar películas..." 
      animated="true"
      show-clear-button="focus"
      (ionInput)="handleInput($event)"
      class="neon-searchbar">
    </ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" style="--background: #0f1e23;">
  
  <div class="center-msg" *ngIf="isSearching">
    <ion-spinner name="crescent" color="primary"></ion-spinner>
  </div>

  <div class="center-msg" *ngIf="!isSearching && results.length === 0">
    <ion-icon name="film-outline" style="font-size: 3rem; opacity: 0.3; color: white;"></ion-icon>
    <p style="color: #666; margin-top: 10px;">Explora el catálogo</p>
  </div>

  <ion-grid *ngIf="results.length > 0">
    <ion-row>
      <ion-col size="4" size-md="3" *ngFor="let movie of results">
        <div class="poster-card" (click)="goToDetail(movie)">
          <img [src]="movie.poster" />
        </div>
      </ion-col>
    </ion-row>
  </ion-grid>

</ion-content>
